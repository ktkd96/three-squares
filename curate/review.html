<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picks Review</title>
<style>
  :root {
    --bg: #f6f1e7; --surface: #fffdf8; --ink: #23201b; --muted: #6f675b; --line: #e4dccd;
    --accent: #2f6f62; --accent-soft: #e3efeb; --maybe: #9a6b16; --maybe-soft: #f6ead2;
    --reject: #a2452c; --reject-soft: #f6e1da; --warn: #a2452c;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1916; --surface: #24211d; --ink: #ece6da; --muted: #a39a8a; --line: #36322b;
      --accent: #7cc2b1; --accent-soft: #23352f; --maybe: #e0b45e; --maybe-soft: #3a3020;
      --reject: #e08a70; --reject-soft: #3d2520; --warn: #e08a70; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
  button, input, select, textarea { font: inherit; color: inherit; }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 14px 16px;
  }
  .row { max-width: 860px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  h1 { font-size: 17px; margin: 0 auto 0 0; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs button {
    border: 1px solid var(--line); background: transparent; border-radius: 999px;
    padding: 5px 12px; cursor: pointer; font-size: 14px;
  }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tabs .n { opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .filters { margin-top: 10px; }
  input[type=search], select {
    border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px;
  }
  input[type=search] { flex: 1; min-width: 160px; }
  .publish {
    border: 0; background: var(--accent); color: var(--surface); font-weight: 600;
    border-radius: 999px; padding: 8px 16px; cursor: pointer;
  }
  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 80px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; background: var(--surface); }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; margin-bottom: 12px; display: grid; gap: 10px;
  }
  .card.focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.approved { border-left: 4px solid var(--accent); }
  .card.maybe { border-left: 4px solid var(--maybe); }
  .card.rejected { border-left: 4px solid var(--reject); opacity: .75; }
  .top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .name { font-weight: 650; font-size: 17px; }
  .name a { color: inherit; text-decoration: none; }
  .name a:hover { text-decoration: underline; }
  .badge { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .warn { font-size: 12px; color: var(--warn); }
  .blurb { color: var(--muted); margin: 0; }
  .src { font-size: 12px; color: var(--muted); }
  .fields { display: grid; grid-template-columns: 180px 1fr; gap: 8px; }
  .fields input, .fields textarea {
    border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; width: 100%;
  }
  .fields textarea { resize: vertical; min-height: 38px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .actions button {
    border: 1px solid var(--line); background: transparent; border-radius: 999px;
    padding: 6px 14px; cursor: pointer; font-weight: 500;
  }
  .actions .a[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .actions .m[aria-pressed="true"] { background: var(--maybe-soft); border-color: var(--maybe); color: var(--maybe); }
  .actions .r[aria-pressed="true"] { background: var(--reject-soft); border-color: var(--reject); color: var(--reject); }
  .saved { font-size: 12px; color: var(--muted); margin-left: auto; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
  }
  @media (max-width: 600px) { .fields { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Picks Review</h1>
    <button class="publish" id="publish" type="button">Publish approved</button>
  </div>
  <div class="row filters">
    <div class="tabs" id="tabs"></div>
    <select id="topic" aria-label="Filter by topic"></select>
    <input type="search" id="q" placeholder="Search name or description" aria-label="Search">
  </div>
</header>
<main>
  <p class="hint">Open each link and decide. Your category and note are what readers see in the app.
    Keys on the highlighted card: <kbd>A</kbd> approve, <kbd>M</kbd> maybe, <kbd>R</kbd> reject, <kbd>J</kbd>/<kbd>K</kbd> next/previous, <kbd>O</kbd> open link.</p>
  <div id="list"></div>
</main>
<script>
(function () {
  var state = { candidates: [], decisions: {} };
  var view = "pending", topic = "", query = "", focusIdx = 0;
  var TABS = [["pending", "To review"], ["maybe", "Maybe"], ["approved", "Approved"], ["rejected", "Rejected"], ["all", "All"]];
  var listEl = document.getElementById("list");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function statusOf(c) { return (state.decisions[c.id] || {}).status || "pending"; }
  function toast(msg) {
    var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200);
  }

  function visible() {
    var q = query.toLowerCase();
    return state.candidates.filter(function (c) {
      var s = statusOf(c);
      if (view !== "all" && s !== view) return false;
      if (topic && c.topic !== topic) return false;
      if (q && (c.name + " " + c.blurb).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  function categories() {
    var set = {};
    state.candidates.forEach(function (c) { set[c.topic] = 1; });
    Object.keys(state.decisions).forEach(function (id) { var d = state.decisions[id]; if (d.category) set[d.category] = 1; });
    return Object.keys(set).sort();
  }

  function renderChrome() {
    var counts = { pending: 0, maybe: 0, approved: 0, rejected: 0, all: state.candidates.length };
    state.candidates.forEach(function (c) { counts[statusOf(c)]++; });
    document.getElementById("tabs").innerHTML = TABS.map(function (t) {
      return '<button type="button" data-view="' + t[0] + '" aria-pressed="' + (view === t[0]) + '">' +
        t[1] + '<span class="n">' + counts[t[0]] + "</span></button>";
    }).join("");
    var topics = {}; state.candidates.forEach(function (c) { topics[c.topic] = 1; });
    document.getElementById("topic").innerHTML = '<option value="">All topics</option>' +
      Object.keys(topics).sort().map(function (t) {
        return "<option" + (t === topic ? " selected" : "") + ">" + esc(t) + "</option>";
      }).join("");
    var dl = document.getElementById("cats") || document.body.appendChild(Object.assign(document.createElement("datalist"), { id: "cats" }));
    dl.innerHTML = categories().map(function (c) { return '<option value="' + esc(c) + '">'; }).join("");
  }

  function renderList() {
    var items = visible();
    if (focusIdx >= items.length) focusIdx = Math.max(0, items.length - 1);
    if (!items.length) {
      listEl.innerHTML = '<p class="empty">' + (view === "pending" ? "All reviewed. Nice." : "Nothing here.") + "</p>";
      return;
    }
    listEl.innerHTML = items.map(function (c, i) {
      var d = state.decisions[c.id] || {}, s = statusOf(c);
      var warn = c.linkStatus === "dead" ? "Link looks dead" :
        c.linkStatus === "blocked" || c.linkStatus === "unreachable" ? "Couldn't auto-check link, open it to confirm" : "";
      return '<article class="card ' + s + (i === focusIdx ? " focus" : "") + '" data-id="' + esc(c.id) + '" data-i="' + i + '">' +
        '<div class="top"><span class="name"><a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.name) + " ↗</a></span>" +
        '<span class="badge">' + esc(c.platform) + '</span><span class="badge">' + esc(c.topic) + "</span>" +
        (warn ? '<span class="warn">' + warn + "</span>" : "") + "</div>" +
        '<p class="blurb">' + esc(c.blurb) + "</p>" +
        '<div class="fields">' +
        '<input class="cat" list="cats" placeholder="Category" aria-label="Category" value="' + esc(d.category || c.topic) + '">' +
        '<textarea class="note" rows="1" placeholder="Why you recommend it (shown in the app). Leave empty to use the description." aria-label="Your note">' + esc(d.note) + "</textarea>" +
        "</div>" +
        '<div class="actions">' +
        '<button type="button" class="a" data-s="approved" aria-pressed="' + (s === "approved") + '">Approve</button>' +
        '<button type="button" class="m" data-s="maybe" aria-pressed="' + (s === "maybe") + '">Maybe</button>' +
        '<button type="button" class="r" data-s="rejected" aria-pressed="' + (s === "rejected") + '">Reject</button>' +
        (s !== "pending" ? '<button type="button" data-s="pending">Undo</button>' : "") +
        '<span class="src">from ' + esc(c.source) + '</span><span class="saved"></span>' +
        "</div></article>";
    }).join("");
  }

  function render() { renderChrome(); renderList(); }

  function save(card, status) {
    var id = card.dataset.id;
    var body = {
      id: id,
      status: status || statusOf({ id: id }),
      category: card.querySelector(".cat").value,
      note: card.querySelector(".note").value,
    };
    return fetch("/api/decision", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error("Save failed"); return r.json(); })
      .then(function (d) { state.decisions[id] = d; return d; })
      .catch(function (e) { toast(e.message); throw e; });
  }

  function decide(card, status) {
    save(card, status).then(function () {
      // In a filtered view the card moves out; keep the focus position for the next one.
      render();
      var f = listEl.querySelector(".card.focus");
      if (f) f.scrollIntoView({ block: "nearest", behavior: "smooth" });
    });
  }

  listEl.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-s]");
    var card = e.target.closest(".card");
    if (card) focusIdx = Number(card.dataset.i);
    if (btn && card) decide(card, btn.dataset.s);
  });

  var timers = {};
  listEl.addEventListener("input", function (e) {
    var card = e.target.closest(".card");
    if (!card) return;
    clearTimeout(timers[card.dataset.id]);
    timers[card.dataset.id] = setTimeout(function () {
      save(card).then(function () {
        var s = card.querySelector(".saved"); if (s) s.textContent = "Saved";
        renderChrome();
      });
    }, 500);
  });

  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    view = b.dataset.view; focusIdx = 0; render();
  });
  document.getElementById("topic").addEventListener("change", function (e) { topic = e.target.value; focusIdx = 0; render(); });
  document.getElementById("q").addEventListener("input", function (e) { query = e.target.value; focusIdx = 0; renderList(); });

  document.addEventListener("keydown", function (e) {
    if (e.target.matches("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
    var cards = listEl.querySelectorAll(".card");
    var card = cards[focusIdx];
    var k = e.key.toLowerCase();
    if (k === "j" || k === "k") {
      focusIdx = Math.max(0, Math.min(cards.length - 1, focusIdx + (k === "j" ? 1 : -1)));
      renderList();
      var f = listEl.querySelector(".card.focus"); if (f) f.scrollIntoView({ block: "nearest" });
    } else if (card && (k === "a" || k === "m" || k === "r")) {
      decide(card, { a: "approved", m: "maybe", r: "rejected" }[k]);
    } else if (card && k === "o") {
      window.open(card.querySelector(".name a").href, "_blank", "noopener");
    }
  });

  document.getElementById("publish").addEventListener("click", function () {
    fetch("/api/publish", { method: "POST" }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.error) throw new Error(d.error);
      toast("Published " + d.published + " picks to picks.js. Commit and push to put them online.");
    }).catch(function (e) { toast("Publish failed: " + e.message); });
  });

  fetch("/api/state").then(function (r) { return r.json(); }).then(function (s) { state = s; render(); })
    .catch(function () { listEl.innerHTML = '<p class="empty">Couldn\'t load. Is "node curate.mjs review" running?</p>'; });
})();
</script>
</body>
</html>
